persona: cmo
display_name: "Chief Marketing Officer"
f1_analog: "Marketing Director"
scope: |
  Marketing operating system, brand-marketing oversight across all 5 brands
  (WD, AvI, AIPG, CD, Book'd, P&P, Agent Empire), per-brand production lanes,
  content velocity, brand-search trend, demand-gen pipeline contribution.

cron_cadence: twice_daily
wake_times_cdt: ["07:00", "18:00"]
adversarial_review: required
escalation_email_red: michael@worshipdigital.co

kpis:
  - name: weekly_qualified_leads_organic
    display: "Weekly qualified leads from organic channels (all brands)"
    source: ga4_twenty_join
    target: null                # BASELINE WEEK (locked 2026-06-27): no organic structure built yet — unknown if we're visible in search. Measure 1 week via Phase B collector, then lock target/yellow/red against real baseline.
    target_unit: "leads/week"
    threshold_yellow: null      # set after baseline week
    threshold_red: null         # set after baseline week
    cadence: weekly
    levers:
      - "boost content velocity (spawn higgsfield content agent for under-performing brand)"
      - "audit landing-page conversion (spawn conversion_audit_agent)"
      - "post flag to CRO if conversion-rate gap is downstream of marketing-qualified flow"

  - name: per_brand_search_volume_trend
    display: "Per-brand Google search volume month-over-month"
    source: gsc_per_brand
    target: "+5%"               # locked 2026-06-27 — trend goal, baseline-independent
    target_unit: "MoM %"
    threshold_yellow: 0
    threshold_red: -5
    cadence: weekly
    per_brand: ["worshipdigital.co", "automotiveintelligence.io", "theaiphoneguy.com", "bookd.cx", "buildagentempire.com"]  # .ai->.com fixed 2026-08-11: the site migrated; GSC tracks the .com property
    levers:
      - "spawn seo_audit_agent on declining brand"
      - "redirect content lane priority to declining brand (Zernio + Higgsfield)"

  # newsletter_open_rate CUT 2026-08-11: the locked KPI (loops, target 38%) was set
  # against a newsletter that does not exist on any owned brand — a KPI cannot measure
  # a channel we do not run. Re-add when a brand actually launches a nurture/broadcast
  # list; the Loops surface (tools/loops.py) has no analytics endpoint wrapped anyway.

  - name: publishing_coverage
    display: "Publishing coverage % — shipped vs the daily mandate, per brand x channel"
    source: content_coverage
    target: 95                  # NORTH-STAR (2026-08-11). >=95% green. Coverage = shipped posting-days / intended (7/day per CONNECTED channel), from the durable social_registry (paperclip #256). Replaced content_velocity (coarse 7/wk/brand) with a true per-brand x per-channel ratio now that the registry carries the platform axis and commits back.
    target_unit: "% coverage"
    threshold_yellow: 85        # 85-94 = yellow; <85 = red; <70 = escalate.
    threshold_red: 70           # denominator = configured platforms INTERSECT connected; deliberately-off channels excluded, connection gaps surfaced separately in raw_payload.
    cadence: weekly
    levers:
      - "spawn higgsfield_content_agent for the under-shipping brand x channel"
      - "spawn zernio_repost_agent to syndicate top-performing existing content into empty slots"
      - "flag a connection gap (configured channel not connected, e.g. needsReconnect) to B&T"

  - name: brand_voice_compliance
    display: "Brand voice + hero-metrics policy compliance (% of outbound content passing review)"
    source: content_review_logs
    target: 100                 # locked — per feedback_hero_metrics_policy
    target_unit: "%"
    threshold_yellow: 98
    threshold_red: 95
    cadence: weekly
    levers:
      - "halt offending agent until prompt fix lands"
      - "post flag to B&T for prompt update"

token_budget_daily_usd: 1      # locked 2026-06-28 — runaway tripwire, NOT a target. Personas fire via Anthropic API (per-token, not covered by Claude Max). At $1: ~7 Opus / ~12 Sonnet / ~37 Haiku flags/day before halt — ample at current volume; lift per-seat as volume grows.
