# Studio weekly SOCIAL engine brand config (the cloud port of studio_weekly_prep).
# Adding/adjusting a brand = a config edit, not a code change (mirrors
# config/slipstream_brands.yaml). The engine produces next week's posts, gates
# them (Iris visual / Scrutineer copy / Conversion), and schedules the gap-fill
# via tools/social_load into each platform's file-103 native-peak window.
#
# CADENCE: posts_per_run is 7 = DAILY coverage (one post per brand per platform per
# day, Mon-Sun) at each platform's native peak. The mandate is never miss a day on
# any channel; the old value of 3 landed only Tue/Thu/Sat and left Fri + the weekend
# empty. The file-121 queue guard dedupes at brand+platform+local-day, so one post
# per day is exactly its ceiling and never self-collides. Do NOT push this above 7:
# a second same-day post per platform would be dropped as a queue conflict anyway.
#
# enabled: false keeps a brand OUT of an engine run entirely (not connected /
# held). Connectivity is ALSO re-checked live against Zernio at run time (the
# live check overrides this file, same as the laptop engine's STEP 2); a brand
# with no live account for a platform is skipped for that platform, never forced.
#
# business_key = the fal image key (NOT the display name); zernio_profile = the
# Zernio profile display name (WD posts through the legacy Calling Digital
# profile). platforms = the platforms to PRODUCE for; the live account set still
# gates what actually schedules.
#
# allowed_ctas = the ONLY fulfillment paths a post's CTA may direct to. Every
# entry is a rail that actually EXISTS (a live URL). The Conversion gate is bound
# to this list: it may NOT write a CTA that promises a DM / comment-keyword reply,
# because NO brand has a DM-capture rail (Sonar's inbox = comments/mentions read
# only; GHL DM automation = AIPG-only-if-wired; AvI/WD = none). 2026-07-28 incident:
# the engine shipped "DM 'EQUITY'" CTAs with no capture behind them. A promised
# follow-up with no rail is worse than no CTA. Add a rail here BEFORE a CTA may use it.
brands:
  automotive_intelligence:
    display_name: "Automotive Intelligence"
    business_key: autointelligence
    zernio_profile: "Automotive Intelligence"
    enabled: true
    posts_per_run: 7   # daily Mon-Sun
    platforms: ["linkedin", "x", "facebook", "instagram"]
    voice: "restrained, diagnostic, anti-hype, operator-grounded; speaks to dealership GMs and dealers"
    # No Agent-Empire jargon (22 agents / 5 rivers / 3 live CRMs) -- translate to dealer value.
    themes_note: "dealer AI value: lead response, un-worked equity, vendor-guarantee scrutiny, time saved. No OEM vehicle hero shots (recognizable-OEM = hard fail); prefer abstract data/interior/operator scenes."
    allowed_ctas:
      - "book a free AI diagnostic call at https://automotiveintelligence.io/diagnostic-call"
      - "run the free AI Reality Check at https://automotiveintelligence.io/ai-reality-check"
  ai_phone_guy:
    display_name: "The AI Phone Guy"
    business_key: aiphoneguy
    zernio_profile: "AI Phone Guy"
    enabled: true
    posts_per_run: 7   # daily Mon-Sun
    platforms: ["facebook", "instagram"]   # only FB+IG connected (live check confirms)
    voice: "plainspoken, trade-savvy, anti-hype, for home-service owners (HVAC, plumbing, electrical)"
    themes_note: "never-miss-a-call, after-hours booking, one-truck shops. Show the buyer's world (vans/ladders/phones), not a desk. No brand badges on vehicles."
    allowed_ctas:
      - "see how it works / book a discovery call at https://theaiphoneguy.com/discovery"
      - "get in touch at https://theaiphoneguy.com/contact"
  worship_digital:
    display_name: "Worship Digital"
    business_key: worshipdigital
    zernio_profile: "Calling Digital"   # WD routes through the legacy Calling Digital profile
    enabled: true
    posts_per_run: 3   # SLOWED 2026-09-03 (Michael): was 7 (daily). 3 = Mon/Wed/Fri.
    platforms: ["facebook", "linkedin", "instagram", "x"]
    voice: "full-service SMB marketing agency for the 380 corridor; practical, results-first; NOT faith-centered"
    themes_note: "SMB marketing: reporting clarity, stop-boosting-random-posts, local lead gen. Not churchy."
    # TODO(CMG/Studio): confirm WD's exact free-sample / audit-request URL and add it
    # here. Until then CTAs point to the live site root (verified 200), never an
    # invented deep-link and never a DM/comment keyword.
    allowed_ctas:
      - "request a free marketing review at https://worshipdigital.co"
  agent_empire:
    display_name: "Agent Empire"
    business_key: agentempire
    zernio_profile: "Agent Empire"
    enabled: true          # OAuth landed 2026-07-20 (FB + IG + YouTube connected); was zero-account
    posts_per_run: 3   # SLOWED 2026-09-03 (Michael): was 7 (daily). 3 = Mon/Wed/Fri.
    platforms: ["facebook", "instagram"]   # connected text platforms; LinkedIn/X not connected, YouTube is not a text post
    voice: "builder field-notes, honest, plain; B2C for people building agent businesses; ledger-only numbers"
    # COMPLIANCE: no income/earnings/outcome claims (same discipline as Book'd); no "22 agents / 5 rivers / 3 CRMs" jargon in outward copy -- translate to builder value.
    themes_note: "what it actually costs / takes to run an agent build, honest field notes from real builds, no hype, no get-rich framing. Abstract build/ops visuals, no fabricated dashboards."
    allowed_ctas:
      - "see the build at https://buildagentempire.com/10-agents"
      - "read the field notes at https://buildagentempire.com/blog"
  # book'd is intentionally NOT enabled here:
  #  - book'd: always Ryan's sign-off; tools/social_load raises NoRailError for it,
  #    so it is structurally held even if produced. Stage-and-flag only.
