# Watchdog coverage config. Brand/threshold specifics live here, not in code,
# so extending coverage to a new business is a config edit, not a rewrite.
#
# blog_max_age_hours: 0 disables the blog-freshness check for that brand
# (content HELD, or no blog engine yet). Everything else stays covered.
brands:
  automotive_intelligence:
    sitemap_url: https://automotiveintelligence.io/sitemap.xml
    blog_max_age_hours: 96      # cadence ~ every 2 days + headroom
    severity: warn
  ai_phone_guy:
    sitemap_url: https://theaiphoneguy.com/sitemap.xml
    blog_max_age_hours: 96
    severity: warn
  agent_empire:
    sitemap_url: https://buildagentempire.com/sitemap.xml
    blog_max_age_hours: 168     # weekly-ish; social distribution still a GAP
    severity: warn
  worship_digital:
    sitemap_url: https://worshipdigital.co/sitemap.xml
    blog_max_age_hours: 192     # RE-ENABLED 2026-08-01: WD now publishes via Slipstream
                                # (human-merged, ~weekly). 192h (8 days) clears a weekly
                                # cadence and fires only on a genuine miss.
    severity: warn
  paper_and_purpose:
    sitemap_url: https://paperandpurpose.co/sitemap.xml
    blog_max_age_hours: 0       # no blog engine on P&P (GAP per rails ledger)
    severity: warn
  bookd:
    sitemap_url: https://bookd.cx/sitemap.xml
    blog_max_age_hours: 0       # staged, holds for Ryan
    severity: warn
site_urls:
  - https://automotiveintelligence.io
  - https://theaiphoneguy.com
  - https://worshipdigital.co
  - https://crm.worshipdigital.co
  - https://buildagentempire.com
  - https://bookd.cx
  - https://paperandpurpose.co
# weekly_social: the Studio weekly SOCIAL batch. Unlike blog freshness (a live
# URL), the batch's landed signal is the committed deliverable folder
# marketing_deliverables/<n>_studio_weekly_<Mon-date>. max_age_hours: 0 disables
# it (default) -- the current LAPTOP engine does not reliably commit its folder,
# so enabling now would false-alarm on a healthy run. ENABLE at the social-engine
# cloud cutover (the stateless cloud engine commits every run); suggested 240
# (10 days: comfortably clears a weekly cadence, fires only on a genuine miss).
weekly_social:
  max_age_hours: 240   # ENABLED at cutover 2026-07-20: the cloud engine commits its
                       # deliverable folder every run, so 240h (10 days) clears a weekly
                       # cadence and fires only on a genuine miss.
  severity: warn
# monitors: the two Railway-ported laptop dailies (tp-daily 07:15 CT, growth-monitor
# 18:00 CT). Each commits a dated block to its avo-telemetry state file; freshness of
# the newest block is the signal. 0 disables (default) -- ENABLE each to ~30h at its
# cloud cutover (30h clears a daily cadence, fires on a genuine missed run).
monitors:
  tp_daily_max_age_hours: 30       # ENABLED at cutover 2026-07-20 (both proven green
  growth_monitor_max_age_hours: 30 # in the cloud; laptop plists retired). 30h clears a
                                   # daily cadence, fires on a genuine missed cron run.
# slipstream_queues: the Railway Slipstream blog engine takes the next unchecked
# '- [ ]' topic from each brand's queue file (locations are the SoT in
# config/slipstream_brands.yaml). A queue with no unchecked topics left makes the
# brand HOLD SILENTLY -- produce nothing every run -- which is exactly the
# 2026-07-31 BAE miss (that queue was NOT exhausted; a stale branch wedged it, but
# an exhausted queue fails the same silent way). This check reads each enabled
# brand's queue via the GitHub Contents API and alerts when the unchecked count
# drops to/below min_unchecked, so a draining queue is a VISIBLE anomaly on the
# rail with refill runway. min_unchecked: 0 disables the check.
slipstream_queues:
  min_unchecked: 3     # alert at <= 3 unchecked topics left (a few runs of runway)
  severity: warn
emails_sent:
  window_days: 7
  min_prospects_for_alert: 25
# media_worker: the cloud (Railway) off-laptop video render service. Trigger-driven,
# so there is no render cadence to age-check -- the signal is simply reachability of
# its health endpoint. ENABLED (unlike the disabled-until-cutover checks) because the
# worker is already live in the cloud; if it goes down, no video can be produced off
# the laptop. Clearing health_url disables the check (treated as not-yet-deployed).
media_worker:
  health_url: https://media-worker-production-361a.up.railway.app/health
  severity: critical
telemetry:
  repo: salesdroid/avo-telemetry
  max_stale_hours: 48
# postal_auth: the inbound Postal/Gmail rail (6 accounts: avi, wd, aipg,
# agentempire, bookd, salesdroid). Each account holds a per-account Google OAuth
# token; when one is revoked/expired its postal_tokens.status flips to
# 'needs_reauth' and that inbox goes DARK -- no inbound sweep, no CMO override
# reply -- SILENTLY. That is exactly what happened 2026-07-01: all 6 tokens
# revoked, undetected for a MONTH, because nothing watched auth-state. This check
# reads the same auth state the /postal/status endpoint exposes and flags any
# account whose status != 'active' on day 1. enabled: false no-ops the check.
postal_auth:
  enabled: true
  severity: warn
  # FAIL CLOSED: any of these accounts absent from the connected-accounts list
  # entirely (wiped table, dropped row) is an anomaly -- iterating only what the
  # source returns would read a wiped table as healthy. Empty list = legacy
  # (present-accounts-only) behavior.
  expected_accounts: [avi, wd, aipg, agentempire, bookd, salesdroid]
# heartbeats: services with no committed output record a monitor_heartbeats row per
# completed run (services.watchdog.record_heartbeat); this ages those rows. Catches
# a cron that dies or errors every run while producing nothing -- sonar's cheap
# no-new-items exit writes nothing, so only its heartbeat proves it swept. Hourly
# cadence + 3h threshold = fires after ~3 consecutive missed/failed sweeps.
# 0 disables a service.
heartbeats:
  sonar_inbox_max_age_hours: 3
  wd_dmarc_max_age_hours: 200   # weekly Sun 08:00 CT; 200h clears the 168h cadence,
                                # fires ~32h after a genuinely missed audit
# alert_rail: the watchdog-of-watchdogs leg pointing at DELIVERY. These GitHub
# Actions workflows are the only path from "anomaly recorded" to "Michael knows";
# GitHub can auto-disable schedules (60-day inactivity) or throttle them silently.
# Ages each workflow's newest SUCCESSFUL run. 6h clears observed scheduler drift
# (the 20-min cron really fires every ~2.5h under throttle) and fires only when the
# rail is genuinely dead. A rail-down anomaly is delivered by direct Resend email
# (the rail cannot deliver its own obituary). max_age_hours 0 disables.
alert_rail:
  repo: salesdroid/avo-telemetry
  workflows:
    - watchdog.yml
    - paperclip_uptime.yml
  max_age_hours: 6
  severity: critical
  notify_email: michael@automotiveintelligence.io
# acknowledged: executive acks on record. A listed fingerprint stays OFF the email
# rail (shown in a quiet "acknowledged" section of the issue instead) until its
# `until` date passes, then it resurfaces by itself. Ack a KNOWN condition with a
# reason; never mute the rail to silence a symptom.
acknowledged:
  - fingerprint: emails-sent-zero
    until: '2026-09-30'
    reason: >-
      SDR desk is in shadow mode by design (sends stay Michael-gated), so the
      agent send rail showing 0 emails while prospects fill is EXPECTED. Resurfaces
      2026-10-01; remove this ack at SDR go-live so the check guards the live rail.
