# Slipstream engine brand config. Adding a brand = a config edit, not code.
# Most brands are Next.js/Vercel with the MDX component kit (format omitted =>
# defaults to "mdx"). Worship Digital stores posts as TS objects in one file
# (format: ts_posts_array) and is human-merged (auto_merge: false).

# Vercel team that owns every brand project. merge_when_green verifies the PR's
# preview build via the Vercel API (VERCEL_API_TOKEN), NOT GitHub check-runs
# (the fine-grained PAT lacks checks:read, which 403'd every merge). Per-brand
# vercel_project_id below scopes the deployment lookup to the right project.
vercel_team_id: team_1RhVPmDufqg6ESm15xfkXWQL

brands:
  autointelligence:
    repo: salesdroid/automotive-intelligence
    vercel_project_id: prj_GwgqlMDuErlGKm2rsLGPGOn2ve51
    domain: automotiveintelligence.io
    enabled: true
    blog_dir: src/content/blog
    business_key: autointelligence
    voice: "restrained, diagnostic, anti-hype, operator-grounded"
    components: ["AnswerFirst", "EntityDefinition", "Callout", "ConsoleDiagram", "PullQuote", "KeyTakeaway", "StatRow"]
    money_pages: ["/ai-reality-check", "/diagnostic-call", "/lead-intelligence", "/services"]
    queue_path: automation/content-queue.md
  aiphoneguy:
    repo: salesdroid/ai-phone-guy-site
    vercel_project_id: prj_Q26URPlYmK1PFY57BSjTFtUJNLko
    domain: theaiphoneguy.com
    enabled: true
    blog_dir: src/content/blog
    business_key: aiphoneguy
    voice: "plainspoken, trade-savvy, anti-hype, for home-service owners"
    components: ["AnswerFirst", "EntityDefinition", "Callout", "PullQuote", "KeyTakeaway", "StatRow"]
    money_pages: ["/discovery", "/how-it-works", "/contact"]
    queue_repo: salesdroid/avo-telemetry
    queue_path: scripts/blog_queues/aipg_topics.md
  agentempire:
    repo: salesdroid/buildagentempire
    vercel_project_id: prj_mhJYWyIm1arV3RQhQIlbmfvYG6ot
    domain: buildagentempire.com
    enabled: true
    blog_dir: src/content/blog
    business_key: agentempire
    voice: "builder field-notes, honest, ledger-only numbers, no income claims"
    components: ["AnswerFirst", "EntityDefinition", "Callout", "ConsoleDiagram", "PullQuote", "KeyTakeaway", "StatRow", "HeroBanner"]
    money_pages: ["/10-agents", "/blog"]
    queue_repo: salesdroid/avo-telemetry
    queue_path: scripts/blog_queues/bae_topics.md
  worshipdigital:
    repo: salesdroid/worship-digital        # NOTE: worship-digital, NOT worship-digital-site
    vercel_project_id: prj_6IuzlVBshSxrAeIny3Q6CiJJxSm5   # unused while auto_merge:false, wired for when it flips
    domain: worshipdigital.co
    enabled: true
    auto_merge: false                         # first runs are human-merged; see engine ceiling
    format: ts_posts_array
    posts_file: src/content/posts.ts
    business_key: worshipdigital
    voice: "transparent, founder-access (Michael), SMB-advocate, plain owner-to-owner, anti-buzzword; full-service marketing partner for small businesses worldwide; NOT faith/church framing; never name DataMoon"
    components: ["answer","definition","callout","quote","stat","sources","image","links","table"]
    money_pages: ["/quote","/intent","/services","/pricing","/contact"]
    queue_repo: salesdroid/avo-telemetry
    queue_path: scripts/blog_queues/wd_topics.md
  bookd:
    repo: Kingvelazquez013/bookdcx-website   # Ryan's repo; Michael is co-founder, no permission gate
    domain: bookd.cx                          # Cloudflare Pages auto-deploys from main
    enabled: true
    # auto_merge stays OFF for a mechanical reason, not a permission one:
    # merge_when_green verifies a PR by polling the VERCEL API, and bookd.cx is
    # hosted on Cloudflare Pages, so there is no Vercel deployment to check and
    # the merge would fail closed every time. The engine opens a PR each run and
    # a human merges it. Flipping this to true requires a Cloudflare Pages build
    # check in merge_when_green first.
    auto_merge: false
    # format omitted => "mdx". The blog was converted from TSX-module-per-post to
    # MDX in bookdcx-website PR #10 so engine output drops in as one .mdx file.
    blog_dir: src/content/blog
    business_key: bookd
    voice: "compliance-first CRM for independent life insurance agents; plain, direct, agent-to-agent; Michael or Ryan may front; every statistic cited to a primary source (state codes, NAIC, FINRA, NIPR); NEVER pricing, NEVER income/earnings/outcome/guarantee claims (insurance compliance); no em-dashes"
    # Must match src/components/blog/MDXComponents.tsx in bookdcx-website. That
    # pipeline silently DROPS JSX expression props, so every component here takes
    # string-literal props only (StatRow is value/label/source/href, never items=[...]).
    components: ["AnswerFirst", "EntityDefinition", "Callout", "PullQuote", "KeyTakeaway", "StatRow", "InBodyImage"]
    money_pages: ["/pricing", "/blog"]
    queue_repo: salesdroid/avo-telemetry
    queue_path: scripts/blog_queues/bookd_topics.md
  paperandpurpose:
    # NO `repo` key on purpose: P&P is a Shopify STOREFRONT, not a git repo, which
    # is the whole reason it sat off the engine. `shopify_article` publishes through
    # the Admin API (services/slipstream_shopify.py) instead of opening a PR.
    domain: paperandpurpose.co
    enabled: true    # NOTE: `enabled` is what the MWF cron iterates (app.py _run_slipstream_mwf),
                     # so this brand produces a DRAFT every Mon/Wed/Fri. Drafts only, never live.
                     # Set false to keep P&P on-demand only via POST /admin/run-slipstream.
    format: shopify_article
    auto_merge: false                         # never read on this path (no PR exists); stated so a
                                              # future refactor cannot infer consent to auto-publish
    # DRAFT ONLY, ALWAYS. CLIENT work, Miriam-gated: the adapter creates every article
    # with published=false and reads it back to prove it. Nothing here goes publicly
    # live without Miriam setting it Visible in the Shopify admin.
    shopify_secret_suffix: PAPERANDPURPOSE     # -> SHOPIFY_SHOP_/ADMIN_TOKEN_/CLIENT_ID_/CLIENT_SECRET_ in Doppler paperclip/prd
    blog_handle: news                          # the store's only blog (id 93783949400), discovered via blogs.json
    author: Miriam Rubio                       # byline is MIRIAM, never Michael
    business_key: paperandpurpose
    voice: "faith-informed guided journal and planner for women, by Paper & Purpose. Warm, encouraging, peer-not-teacher, NEVER preachy. The author and the only person ever referenced as the founder is MIRIAM (Miriam Rubio); never write as Michael, never mention Michael, never invent Miriam's personal, family or biographical details. Write the WHOLE post to ONE of the two ICP lanes and NEVER mix them: Lane A is the Returning Woman, 28-45, often a working mom, message 'you are not behind, you are becoming'; Lane B is the Christian Girly, 18-27, aesthetic-driven, friend-not-sermon. Default to Lane A unless the topic names Lane B. The first print run ships October 2026, always stated as 'October 2026', never another month, always preorder or reserve framing and never crowdfunding words like backer or campaign. Primary call to action is /pages/the-journal. NO fabricated or unsourced statistics, ever: cite a real published source or stay qualitative. NO em-dashes anywhere. NEVER name a competitor. Never name DataMoon. Imagery is restrained sage, cream and gold botanicals with NO people and NO faces."
    components: ["answer","definition","callout","quote","stat","sources","image","links","table"]
    money_pages: ["/pages/the-journal", "/pages/our-story"]
    queue_repo: salesdroid/avo-telemetry
    queue_path: scripts/blog_queues/pp_topics.md
