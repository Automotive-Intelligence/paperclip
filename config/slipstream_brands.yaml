# Slipstream engine brand config. Adding a brand = a config edit, not code.
# Most brands are Next.js/Vercel with the MDX component kit (format omitted =>
# defaults to "mdx"). Worship Digital stores posts as TS objects in one file
# (format: ts_posts_array) and is human-merged (auto_merge: false).

# Vercel team that owns every brand project. merge_when_green verifies the PR's
# preview build via the Vercel API (VERCEL_API_TOKEN), NOT GitHub check-runs
# (the fine-grained PAT lacks checks:read, which 403'd every merge). Per-brand
# vercel_project_id below scopes the deployment lookup to the right project.
vercel_team_id: team_1RhVPmDufqg6ESm15xfkXWQL

# Zernio account ids per brand+platform, used by slipstream_engine._distribute_social.
# THESE ARE LOAD-BEARING FOR SAFETY, not a convenience. publish_to_zernio treats a
# missing account id as "post to EVERY connected account on this platform", so a
# brand with no entry here would cross-post its blog onto every other brand's feed
# (including Book'd, which is Ryan's, and Michael's personal founder profile).
# The loader now REFUSES a job with no account_id (tools/social_load.load_jobs),
# and the engine skips a platform it cannot resolve. A brand missing a platform
# below simply does not get that platform: that is correct and intended, not a gap
# to paper over by omitting the id.
# Re-verified 2026-08-06 against a LIVE Zernio accounts_get_all_accounts_health
# sweep (25 accounts), not the registry file. Three comments here previously
# claimed channels didn't exist (AIPG li/x, BAE ig) that were in fact connected
# and healthy — a stale comment in this block silently suppresses a live channel,
# so re-verify against Zernio, never against another document.
